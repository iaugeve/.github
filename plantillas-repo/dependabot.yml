# Copiar a .github/dependabot.yml en cada repositorio.
# Abre un PR semanal con las dependencias al día, agrupadas para no llenar de PRs.
version: 2
updates:
  - package-ecosystem: npm        # también cubre pnpm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    groups:
      menores:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # Solo en Cuadre (Laravel): descomenta este bloque.
  # - package-ecosystem: composer
  #   directory: /
  #   schedule:
  #     interval: weekly
  #     day: monday
  #   commit-message:
  #     prefix: chore(deps)
  #   groups:
  #     menores:
  #       update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
