# CI para las apps Next.js + pnpm + PostgreSQL de Auge (Caudy, Autoexpress, Nails, Filo, Shop-e).
# Basado en el CI de Autoexpress. Ajusta las variables de entorno y los scripts a los de cada app.
name: CI

on:
  push:
    branches: [$default-branch]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Solo valores de prueba, válidos dentro de este workflow. Los reales van en Settings → Secrets.
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Base de datos
        run: |
          pnpm db:migrate
          pnpm test:db

      - name: Build
        run: pnpm build
